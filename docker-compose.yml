services:
  strata-db:
    image: postgres:17-alpine
    container_name: strata-db
    cpus: 5
    mem_limit: 2000m
    environment:
      POSTGRES_PASSWORD: ${STRATA_DB_SA_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - strata-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - strata-network

  strata-api:
    build: .
    image: strata-api
    container_name: strata-api
    cpus: 1.5
    mem_limit: 320m
    env_file: .env
    environment:
      STRATA_PORT: "5000"
      STRATA_UPLOAD_DIR: /app/upload
      STRATA_MIGRATIONS_DIR: /app/migrations
    entrypoint: ["sh", "-c", "strata migrate && exec strata"]
    ports:
      - "5000:5000"
    volumes:
      - strata-upload:/app/upload
    depends_on:
      strata-db:
        condition: service_healthy
    networks:
      - strata-network

  strata-worker:
    image: strata-api
    container_name: strata-worker
    cpus: 1.5
    mem_limit: 320m
    env_file: .env
    environment:
      STRATA_UPLOAD_DIR: /app/upload
      STRATA_MIGRATIONS_DIR: /app/migrations
    entrypoint: ["strata", "worker"]
    restart: unless-stopped
    healthcheck:
      disable: true
    volumes:
      - strata-upload:/app/upload
    depends_on:
      strata-api:
        condition: service_healthy
    networks:
      - strata-network

  strata-web:
    build:
      context: ${STRATA_WEB_DIR:-../strata-web}
      args:
        NEXT_PUBLIC_API_BASE_URL: ${STRATA_WEB_API_BASE_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_FILES_BASE_URL: ${STRATA_WEB_FILES_BASE_URL:-}
        NEXT_PUBLIC_ACCESS_TOKEN_NAME: ${STRATA_WEB_TOKEN_NAME:-strata_token}
    image: strata-web
    container_name: strata-web
    cpus: 1
    mem_limit: 192m
    ports:
      - "${STRATA_WEB_PORT:-3000}:80"
    depends_on:
      - strata-api
    networks:
      - strata-network

  strata-api-test:
    image: strata-api
    container_name: strata-api-test
    cpus: 3
    mem_limit: 384m
    env_file: .env
    environment:
      STRATA_PORT: "5000"
      STRATA_DB_CONNECTION: ${STRATA_TEST_DB_CONNECTION:-}
      STRATA_UPLOAD_DIR: /app/upload
      STRATA_MIGRATIONS_DIR: /app/migrations
    entrypoint: ["sh", "-c", "strata migrate && exec strata"]
    ports:
      - "5001:5000"
    profiles:
      - load
    depends_on:
      strata-db:
        condition: service_healthy
    networks:
      - strata-network

  strata-mail:
    image: axllent/mailpit:latest
    container_name: strata-mail
    cpus: 0.5
    mem_limit: 96m
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - strata-mail-data:/data
    networks:
      - strata-network

  strata-uptime:
    image: louislam/uptime-kuma:1
    container_name: strata-uptime
    cpus: 0.5
    mem_limit: 192m
    ports:
      - "3001:3001"
    volumes:
      - strata-uptime-data:/app/data
    networks:
      - strata-network

  strata-prometheus:
    image: prom/prometheus:latest
    container_name: strata-prometheus
    cpus: 0.5
    mem_limit: 224m
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - strata-prometheus-data:/prometheus
    networks:
      - strata-network

  strata-grafana:
    image: grafana/grafana-oss:latest
    container_name: strata-grafana
    cpus: 1
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: ${STRATA_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${STRATA_GRAFANA_PASSWORD:-admin123}
    ports:
      - "3002:3000"
    volumes:
      - ./ops/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - strata-grafana-data:/var/lib/grafana
    depends_on:
      - strata-prometheus
    networks:
      - strata-network

  strata-load:
    image: grafana/k6:latest
    container_name: strata-load
    cpus: 1.5
    mem_limit: 512m
    profiles:
      - load
    environment:
      TARGET: ${K6_TARGET:-http://strata-api-test:5000/api}
      MODE: ${K6_MODE:-smoke}
    volumes:
      - ./ops/load:/scripts:ro
    entrypoint: ["k6", "run", "/scripts/journeys.js"]
    networks:
      - strata-network

volumes:
  strata-pg-data:
  strata-upload:
  strata-mail-data:
  strata-uptime-data:
  strata-prometheus-data:
  strata-grafana-data:

networks:
  strata-network:
